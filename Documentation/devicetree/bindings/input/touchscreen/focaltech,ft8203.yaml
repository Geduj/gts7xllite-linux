%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/focaltech,ft8203.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: FocalTech FT8203 TDDI touchscreen controller (SPI)

maintainers:
  - Your Name <you@example.com>

description:
  Touch part of the FocalTech FT8203 touch and display driver IC. The touch
  firmware has no flash and is uploaded by the host into the chip's RAM after
  every reset, so touch follows the power state of the integrated panel.

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: focaltech,ft8203

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  firmware-name:
    maxItems: 1
    description: Touch firmware image, relative to the firmware search path.

  panel:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Panel driven by the same IC. Touch is started after the panel is
      prepared and put to sleep before the panel is unprepared.

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - touchscreen-size-x
  - touchscreen-size-y

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "focaltech,ft8203";
            reg = <0>;
            spi-max-frequency = <6000000>;
            interrupts-extended = <&tlmm 22 IRQ_TYPE_EDGE_FALLING>;
            reset-gpios = <&tlmm 18 GPIO_ACTIVE_LOW>;
            touchscreen-size-x = <1600>;
            touchscreen-size-y = <2560>;
            firmware-name = "tsp_focaltech/ft8203_gts7xllite.bin";
            panel = <&panel>;
        };
    };
